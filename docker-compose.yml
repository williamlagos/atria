version: '3.8'

services:
    web:
        image: atria
        build:
            context: .
            dockerfile: Dockerfile
            target: dev # For development, use the dev stage with local submodule sources
        volumes:
            - .:/app
        environment:
            - DJANGO_SETTINGS_MODULE=atria.settings
            - PYTHONDONTWRITEBYTECODE=1
            - PYTHONUNBUFFERED=1
            - DEBUG=1
            - DATABASE_URL=postgres://atria:development@db:5432/atria
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0
        ports:
            - '8000:8000'
        command: python manage.py runserver 0.0.0.0:8000
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker:
        image: atria
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        volumes:
            - .:/app
        environment:
            - DJANGO_SETTINGS_MODULE=atria.settings
            - PYTHONDONTWRITEBYTECODE=1
            - PYTHONUNBUFFERED=1
            - DATABASE_URL=postgres://atria:development@db:5432/atria
            - CELERY_BROKER_URL=redis://redis:6379/0
            - CELERY_RESULT_BACKEND=redis://redis:6379/0
        command: celery -A atria worker -l info
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    db:
        image: postgres:13
        volumes:
            - postgres_data:/var/lib/postgresql/data
        environment:
            - POSTGRES_DB=atria
            - POSTGRES_USER=atria
            - POSTGRES_PASSWORD=development
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U atria']
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
